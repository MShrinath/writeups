<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writeup Generator - Admin Panel</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
    <script src="/assets/js/admin.js" defer></script>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-pen-fancy"></i> CTF Writeup Generator</h1>
        <p class="subtitle">Fill in your CTF details below and generate your writeup HTML</p>

        <!-- CTF Info Section -->
        <div class="section">
            <h2 class="section-title"><i class="fas fa-info-circle"></i> CTF Information</h2>
            
            <div class="form-group">
                <label for="ctfName">CTF Name *</label>
                <input type="text" id="ctfName" placeholder="picoCTF 2024" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ctfMonth">Month *</label>
                    <select id="ctfMonth">
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ctfYear">Year *</label>
                    <select id="ctfYear">
                        <option>2027</option>
                        <option selected>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ctfTotal">Total Challenges</label>
                    <input type="number" id="ctfTotal" placeholder="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ctfRank">Rank</label>
                    <input type="text" id="ctfRank" placeholder="#123">
                </div>

                <div class="form-group">
                    <label for="ctfTeam">Team</label>
                    <select id="ctfTeam" onchange="toggleTeamNameInput()">
                        <option value="solo">Solo</option>
                        <option value="team">Team</option>
                    </select>
                    <input type="text" id="ctfTeamName" placeholder="Team name" style="display: none; margin-top: 10px;">
                </div>
            </div>

            <div class="form-group">
                <label for="ctfOverview">Overview *</label>
                <textarea id="ctfOverview" placeholder="Brief description of the CTF..." rows="3"></textarea>
            </div>
        </div>

        <!-- Challenges Section -->
        <div class="section">
            <h2 class="section-title" style="margin-bottom: 20px;"><i class="fas fa-flag"></i> Challenges</h2>

            <div id="challengesContainer"></div>

            <button class="btn btn-primary" onclick="addChallenge()" style="margin-top: 15px;">
                <i class="fas fa-plus"></i> Add Challenge
            </button>
        </div>

        <!-- Actions -->
        <div class="actions">
            <div class="action-group">
                <button class="btn btn-success" onclick="generateWriteup()">
                    <i class="fas fa-magic"></i> Generate Writeup HTML
                </button>
                <button class="btn btn-secondary" onclick="generateIndexCard()">
                    <i class="fas fa-home"></i> Generate Index Card
                </button>
                <button class="btn btn-secondary" onclick="downloadHTML()">
                    <i class="fas fa-download"></i> Download HTML
                </button>
            </div>
            <div class="action-sep"></div>
            <div class="action-group">
                <button class="btn btn-secondary" onclick="saveProject()">
                    <i class="fas fa-save"></i> Save JSON
                </button>
                <button class="btn btn-secondary" onclick="loadProject()">
                    <i class="fas fa-folder-open"></i> Load / Import
                </button>
                <button class="btn btn-secondary" onclick="extractJSON()">
                    <i class="fas fa-file-export"></i> Extract JSON
                </button>
            </div>
            <div class="action-sep"></div>
            <div class="action-group">
                <button class="btn btn-danger" onclick="clearAll()">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> <strong>Success!</strong> Your writeup HTML has been generated and copied to clipboard!
        </div>

        <!-- Index Page Card Code Section (Initially Hidden) -->
        <div class="section" id="indexCardSection" style="display: none; margin-top: 20px;">
            <h2 class="section-title"><i class="fas fa-home"></i> Index Page Card Code</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Customize the card details and generate HTML code for your index page</p>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="indexYear">Year</label>
                    <input type="text" id="indexYear" placeholder="2024">
                </div>
                <div class="form-group">
                    <label for="indexMonth">Month</label>
                    <input type="text" id="indexMonth" placeholder="March">
                </div>
                <div class="form-group">
                    <label for="indexType">Type</label>
                    <select id="indexType" onchange="toggleIndexTeamNameInput()">
                        <option value="solo">Solo</option>
                        <option value="team">Team</option>
                    </select>
                    <input type="text" id="indexTeamName" placeholder="Team name" style="display: none; margin-top: 10px;">
                </div>
            </div>

            <!-- Tags Pill Picker (mirrors Challenge Category selector) -->
            <div class="form-group">
                <label>Tags</label>
                <div class="category-picker" id="indexTags-picker">
                    <button type="button" class="cat-pill" data-value="Web" onclick="toggleIndexTag('Web')">Web</button>
                    <button type="button" class="cat-pill" data-value="Crypto" onclick="toggleIndexTag('Crypto')">Crypto</button>
                    <button type="button" class="cat-pill" data-value="Forensics" onclick="toggleIndexTag('Forensics')">Forensics</button>
                    <button type="button" class="cat-pill" data-value="Reverse Engineering" onclick="toggleIndexTag('Reverse Engineering')">Reverse</button>
                    <button type="button" class="cat-pill" data-value="PWN" onclick="toggleIndexTag('PWN')">PWN</button>
                    <button type="button" class="cat-pill" data-value="OSINT" onclick="toggleIndexTag('OSINT')">OSINT</button>
                    <button type="button" class="cat-pill" data-value="Steganography" onclick="toggleIndexTag('Steganography')">Stego</button>
                    <button type="button" class="cat-pill" data-value="Misc" onclick="toggleIndexTag('Misc')">Misc</button>
                    <button type="button" class="cat-pill" data-value="Network" onclick="toggleIndexTag('Network')">Network</button>
                    <button type="button" class="cat-pill" data-value="Malware" onclick="toggleIndexTag('Malware')">Malware</button>
                    <button type="button" class="cat-pill" data-value="CTI" onclick="toggleIndexTag('CTI')">CTI</button>
                    <button type="button" class="cat-pill" data-value="Hardware" onclick="toggleIndexTag('Hardware')">Hardware</button>
                    <button type="button" class="cat-pill" data-value="Programming" onclick="toggleIndexTag('Programming')">Programming</button>
                    <button type="button" class="cat-pill" data-value="Blockchain" onclick="toggleIndexTag('Blockchain')">Blockchain</button>
                    <button type="button" class="cat-pill" data-value="Mobile" onclick="toggleIndexTag('Mobile')">Mobile</button>
                    <button type="button" class="cat-pill" data-value="Trivia" onclick="toggleIndexTag('Trivia')">Trivia</button>
                    <button type="button" class="cat-pill" data-value="Welcome" onclick="toggleIndexTag('Welcome')">Welcome</button>
                </div>
                <!-- Hidden input stores comma-separated selected tags for generateIndexCardCode() to read -->
                <input type="hidden" id="indexTags" value="">
            </div>

            <div class="form-group">
                <label for="indexDescription">Brief Description</label>
                <textarea id="indexDescription" placeholder="Brief overview of the CTF..." rows="2"></textarea>
            </div>

            <div class="form-group">
                <label for="indexFilename">Writeup Filename</label>
                <input type="text" id="indexFilename" placeholder="picoctf2024_writeup.html">
            </div>

            <button class="btn btn-primary" onclick="generateIndexCardCode()" style="margin-top: 10px;">
                <i class="fas fa-code"></i> Generate Index Card Code
            </button>
        </div>

        <!-- Output Area -->
        <div class="output-box" id="outputBox">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <strong style="color: var(--primary);">Generated Code:</strong>
                <button class="btn btn-secondary" onclick="copyOutput()">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>
            <pre id="outputText"></pre>
        </div>
    </div>
</body>
</html>
