<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Writeup Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #020c1b;
            color: #ccd6f6;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #64ffda; font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #8892b0; margin-bottom: 30px; }
        .section {
            background: #112240;
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section h2 {
            color: #64ffda;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label {
            display: block;
            color: #ccd6f6;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #020c1b;
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 6px;
            color: #ccd6f6;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            font-family: 'Courier New', monospace;
            min-height: 80px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #64ffda;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 10px;
            margin-top: 10px;
        }
        .btn-primary { background: #64ffda; color: #020c1b; font-weight: 600; }
        .btn-secondary { background: #112240; color: #ccd6f6; border: 1px solid rgba(100, 255, 218, 0.2); }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .challenge-box {
            background: rgba(100, 255, 218, 0.05);
            border-left: 3px solid #64ffda;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .challenge-box h3 {
            color: #64ffda;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .step-box {
            background: #020c1b;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-success {
            background: rgba(81, 207, 102, 0.1);
            border: 1px solid #51cf66;
            color: #51cf66;
        }
        .output-box {
            background: #020c1b;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .output-box pre {
            color: #ccd6f6;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-pen-fancy"></i> CTF Writeup Generator</h1>
        <p class="subtitle">Simple form-based generator for CTF writeups</p>

        <div class="alert alert-success" id="successAlert">
            <i class="fas fa-check-circle"></i> <strong>Success!</strong> HTML copied to clipboard!
        </div>

        <!-- CTF Info -->
        <div class="section">
            <h2><i class="fas fa-info-circle"></i> CTF Information</h2>
            <label>CTF Name *</label>
            <input type="text" id="ctfName" placeholder="picoCTF 2024">
            
            <div class="grid-3">
                <div>
                    <label>Month *</label>
                    <select id="ctfMonth">
                        <option>January</option><option>February</option><option>March</option>
                        <option>April</option><option>May</option><option>June</option>
                        <option>July</option><option>August</option><option>September</option>
                        <option>October</option><option>November</option><option>December</option>
                    </select>
                </div>
                <div>
                    <label>Year *</label>
                    <select id="ctfYear">
                        <option>2026</option><option>2025</option><option selected>2024</option>
                        <option>2023</option><option>2022</option>
                    </select>
                </div>
                <div>
                    <label>Total Challenges</label>
                    <input type="number" id="ctfTotal" placeholder="100">
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label>Rank</label>
                    <input type="text" id="ctfRank" placeholder="#123">
                </div>
                <div>
                    <label>Team</label>
                    <input type="text" id="ctfTeam" placeholder="Solo or Team Name">
                </div>
            </div>

            <label>Overview *</label>
            <textarea id="ctfOverview" placeholder="Brief description of the CTF..." rows="3"></textarea>
        </div>

        <!-- Challenges Container -->
        <div id="challengesContainer"></div>

        <!-- Add Challenge Button -->
        <button class="btn btn-primary" onclick="addChallenge()">
            <i class="fas fa-plus"></i> Add Challenge
        </button>

        <!-- Generate Buttons -->
        <div style="margin-top: 30px;">
            <button class="btn btn-primary" onclick="generateWriteup()">
                <i class="fas fa-magic"></i> Generate Writeup HTML
            </button>
            <button class="btn btn-secondary" onclick="generateIndexCard()">
                <i class="fas fa-home"></i> Generate Index Card
            </button>
            <button class="btn btn-secondary" onclick="downloadHTML()">
                <i class="fas fa-download"></i> Download HTML
            </button>
            <button class="btn btn-danger" onclick="clearAll()">
                <i class="fas fa-trash"></i> Clear All
            </button>
        </div>

        <!-- Output Area -->
        <div class="output-box" id="outputBox">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <strong style="color: #64ffda;">Generated Code:</strong>
                <button class="btn btn-secondary" onclick="copyOutput()">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>
            <pre id="outputText"></pre>
        </div>
    </div>

    <script>
        let challengeCount = 0;
        let generatedHTML = '';

        function addChallenge() {
            challengeCount++;
            const container = document.getElementById('challengesContainer');
            const div = document.createElement('div');
            div.className = 'challenge-box';
            div.id = 'chal-' + challengeCount;
            div.innerHTML = `
                <h3>
                    <span><i class="fas fa-flag"></i> Challenge ${challengeCount}</span>
                    <button class="btn btn-danger" onclick="removeChallenge(${challengeCount})" style="margin: 0;">
                        <i class="fas fa-times"></i>
                    </button>
                </h3>
                <div class="grid-3">
                    <div>
                        <label>Name *</label>
                        <input type="text" id="ch${challengeCount}-name" placeholder="Web Gauntlet">
                    </div>
                    <div>
                        <label>Category *</label>
                        <select id="ch${challengeCount}-category">
                            <option value="web">Web</option>
                            <option value="crypto">Crypto</option>
                            <option value="forensics">Forensics</option>
                            <option value="reverse">Reverse</option>
                            <option value="pwn">PWN</option>
                            <option value="osint">OSINT</option>
                            <option value="steganography">Steganography</option>
                            <option value="misc">Misc</option>
                        </select>
                    </div>
                    <div>
                        <label>Points</label>
                        <input type="number" id="ch${challengeCount}-points" placeholder="100">
                    </div>
                </div>
                <label>Description *</label>
                <textarea id="ch${challengeCount}-desc" placeholder="Challenge description..." rows="2"></textarea>
                
                <label>Files/Links (one per line, optional)</label>
                <textarea id="ch${challengeCount}-files" placeholder="file.txt&#10;http://challenge.com" rows="2"></textarea>
                
                <label>Solution (your writeup) *</label>
                <textarea id="ch${challengeCount}-solution" placeholder="Explain how you solved it..." rows="6"></textarea>
                
                <label>Flag *</label>
                <input type="text" id="ch${challengeCount}-flag" placeholder="CTF{flag_here}">
            `;
            container.appendChild(div);
        }

        function removeChallenge(id) {
            const elem = document.getElementById('chal-' + id);
            if (elem) elem.remove();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function generateWriteup() {
            const ctfName = document.getElementById('ctfName').value;
            const ctfMonth = document.getElementById('ctfMonth').value;
            const ctfYear = document.getElementById('ctfYear').value;
            const ctfTotal = document.getElementById('ctfTotal').value;
            const ctfRank = document.getElementById('ctfRank').value;
            const ctfTeam = document.getElementById('ctfTeam').value;
            const ctfOverview = document.getElementById('ctfOverview').value;

            if (!ctfName || !ctfOverview) {
                alert('Please fill CTF Name and Overview!');
                return;
            }

            const challenges = [];
            for (let i = 1; i <= challengeCount; i++) {
                const nameElem = document.getElementById('ch' + i + '-name');
                if (!nameElem) continue;
                
                const name = nameElem.value;
                const category = document.getElementById('ch' + i + '-category').value;
                const points = document.getElementById('ch' + i + '-points').value;
                const desc = document.getElementById('ch' + i + '-desc').value;
                const files = document.getElementById('ch' + i + '-files').value;
                const solution = document.getElementById('ch' + i + '-solution').value;
                const flag = document.getElementById('ch' + i + '-flag').value;

                if (name && desc && solution && flag) {
                    challenges.push({ name, category, points, desc, files, solution, flag });
                }
            }

            if (challenges.length === 0) {
                alert('Please add at least one challenge!');
                return;
            }

            let html = '<!DOCTYPE html>\\n<html lang="en">\\n<head>\\n';
            html += '    <meta charset="UTF-8">\\n';
            html += '    <meta name="viewport" content="width=device-width, initial-scale=1.0">\\n';
            html += '    <title>' + escapeHtml(ctfName) + ' Writeup | mshrinath</title>\\n';
            html += '    <link rel="stylesheet" href="writeups-style.css">\\n';
            html += '    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">\\n';
            html += '    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">\\n';
            html += '    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><' + '/script>\\n';
            html += '    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer><' + '/script>\\n';
            html += '    <script src="writeups-script.js" defer><' + '/script>\\n';
            html += '</head>\\n<body>\\n';
            html += '    <div id="particles-js"></div>\\n\\n';
            html += '    <header class="main-header">\\n        <div class="container">\\n            <div class="header-content">\\n';
            html += '                <a href="/writeups" class="back-link"><i class="fas fa-arrow-left"></i><span>Back to CTFs</span></a>\\n';
            html += '                <a href="/" class="nav-link"><i class="fas fa-home"></i></a>\\n';
            html += '            </div>\\n        </div>\\n    </header>\\n\\n    <main>\\n';
            html += '        <section class="writeup-header">\\n            <div class="container">\\n';
            html += '                <div class="breadcrumb">\\n                    <a href="/writeups">CTF Writeups</a>\\n';
            html += '                    <i class="fas fa-chevron-right"></i>\\n';
            html += '                    <span>' + escapeHtml(ctfName) + '</span>\\n                </div>\\n\\n';
            html += '                <h1 class="glitch-text" data-text="' + escapeHtml(ctfName) + '">' + escapeHtml(ctfName) + '</h1>\\n\\n';
            html += '                <div class="writeup-meta-grid">\\n';
            html += '                    <div class="meta-card"><i class="far fa-calendar"></i><div class="meta-content"><span class="meta-label">Date</span><span class="meta-value">' + escapeHtml(ctfMonth) + ' ' + escapeHtml(ctfYear) + '</span></div></div>\\n';
            html += '                    <div class="meta-card"><i class="fas fa-flag-checkered"></i><div class="meta-content"><span class="meta-label">Solved</span><span class="meta-value">' + challenges.length + ' / ' + (ctfTotal || '?') + '</span></div></div>\\n';
            html += '                    <div class="meta-card"><i class="fas fa-trophy"></i><div class="meta-content"><span class="meta-label">Rank</span><span class="meta-value">' + (ctfRank || 'N/A') + '</span></div></div>\\n';
            html += '                    <div class="meta-card"><i class="fas fa-users"></i><div class="meta-content"><span class="meta-label">Team</span><span class="meta-value">' + (ctfTeam || 'Solo') + '</span></div></div>\\n';
            html += '                </div>\\n\\n';
            html += '                <div class="overview-box"><h2>Overview</h2><p>' + escapeHtml(ctfOverview) + '</p></div>\\n\\n';
            html += '                <div class="toc-box"><h3><i class="fas fa-list"></i> Challenges Solved</h3><nav class="toc-nav">\\n';
            
            for (let i = 0; i < challenges.length; i++) {
                const ch = challenges[i];
                html += '                        <a href="#challenge-' + (i+1) + '" class="toc-item">\\n';
                html += '                            <span class="toc-number">' + String(i+1).padStart(2, '0') + '</span>\\n';
                html += '                            <span class="toc-title">' + escapeHtml(ch.name) + '</span>\\n';
                html += '                            <span class="toc-category">' + ch.category.charAt(0).toUpperCase() + ch.category.slice(1) + '</span>\\n';
                html += '                        </a>\\n';
            }
            
            html += '                    </nav></div>\\n            </div>\\n        </section>\\n\\n';
            html += '        <section class="challenges-section">\\n            <div class="container">\\n';

            for (let i = 0; i < challenges.length; i++) {
                const ch = challenges[i];
                html += '                <div id="challenge-' + (i+1) + '" class="challenge-writeup">\\n';
                html += '                    <div class="challenge-header">\\n';
                html += '                        <div class="challenge-number">' + String(i+1).padStart(2, '0') + '</div>\\n';
                html += '                        <div class="challenge-title-group">\\n';
                html += '                            <h2>' + escapeHtml(ch.name) + '</h2>\\n';
                html += '                            <div class="challenge-meta">\\n';
                html += '                                <span class="category-badge ' + ch.category + '">' + ch.category.charAt(0).toUpperCase() + ch.category.slice(1) + '</span>\\n';
                html += '                                <span class="points-badge">' + (ch.points || '?') + ' points</span>\\n';
                html += '                            </div>\\n                        </div>\\n                    </div>\\n\\n';
                html += '                    <div class="challenge-description">\\n';
                html += '                        <h3><i class="fas fa-file-alt"></i> Challenge Description</h3>\\n';
                html += '                        <p>' + escapeHtml(ch.desc) + '</p>\\n';
                
                if (ch.files) {
                    const fileLines = ch.files.split('\\n').filter(f => f.trim());
                    if (fileLines.length > 0) {
                        html += '                        <div class="challenge-files">\\n';
                        for (let f of fileLines) {
                            const icon = f.startsWith('http') ? 'fas fa-link' : 'fas fa-file';
                            html += '                            <span class="file-tag"><i class="' + icon + '"></i> ' + escapeHtml(f) + '</span>\\n';
                        }
                        html += '                        </div>\\n';
                    }
                }
                
                html += '                    </div>\\n\\n';
                html += '                    <div class="writeup-content">\\n';
                html += '                        <h3><i class="fas fa-lightbulb"></i> Solution</h3>\\n';
                
                const paragraphs = ch.solution.split('\\n').filter(p => p.trim());
                for (let p of paragraphs) {
                    html += '                        <p>' + escapeHtml(p) + '</p>\\n';
                }
                
                html += '                    </div>\\n\\n';
                html += '                    <div class="flag-section">\\n';
                html += '                        <h3><i class="fas fa-flag"></i> Flag</h3>\\n';
                html += '                        <div class="flag-box">\\n';
                html += '                            <code>' + escapeHtml(ch.flag) + '</code>\\n';
                html += '                            <button class="copy-btn" onclick="copyFlag(this)"><i class="fas fa-copy"></i></button>\\n';
                html += '                        </div>\\n                    </div>\\n                </div>\\n\\n';
            }

            html += '            </div>\\n        </section>\\n\\n';
            html += '        <section class="writeup-navigation">\\n            <div class="container">\\n';
            html += '                <a href="/writeups" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to All CTFs</a>\\n';
            html += '            </div>\\n        </section>\\n    </main>\\n\\n';
            html += '    <footer>\\n        <div class="container">\\n            <div class="footer-content">\\n';
            html += '                <p>&copy; 2026 mshrinath</p>\\n';
            html += '                <div class="footer-links">\\n';
            html += '                    <a href="/">Portfolio</a>\\n                    <span class="separator">•</span>\\n';
            html += '                    <a href="/writeups">CTF Writeups</a>\\n';
            html += '                </div>\\n            </div>\\n        </div>\\n    </footer>\\n\\n';
            html += '    <script>\\n        hljs.highlightAll();\\n';
            html += '        function copyFlag(btn) {\\n';
            html += '            const flagText = btn.previousElementSibling.textContent;\\n';
            html += '            navigator.clipboard.writeText(flagText);\\n';
            html += '            btn.innerHTML = \\\'<i class="fas fa-check"></i>\\\';\\n';
            html += '            setTimeout(() => { btn.innerHTML = \\\'<i class="fas fa-copy"></i>\\\'; }, 2000);\\n';
            html += '        }\\n    <' + '/script>\\n</body>\\n</html>';

            generatedHTML = html;
            navigator.clipboard.writeText(html).then(() => {
                document.getElementById('successAlert').style.display = 'block';
                setTimeout(() => { document.getElementById('successAlert').style.display = 'none'; }, 3000);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function generateIndexCard() {
            const ctfName = document.getElementById('ctfName').value;
            const ctfMonth = document.getElementById('ctfMonth').value;
            const ctfYear = document.getElementById('ctfYear').value;
            
            if (!ctfName) {
                alert('Please fill CTF Name first!');
                return;
            }

            const solvedCount = document.querySelectorAll('.challenge-box').length;
            const filename = ctfName.toLowerCase().replace(/\s+/g, '_') + '_writeup.html';
            
            let code = '                    <a href="' + filename + '" class="ctf-card" data-year="' + ctfYear + '">\\n';
            code += '                        <div class="ctf-header">\\n';
            code += '                            <div class="ctf-icon"><i class="fas fa-flag"></i></div>\\n';
            code += '                            <div class="ctf-badge">' + solvedCount + ' Solved</div>\\n';
            code += '                        </div>\\n';
            code += '                        <h3 class="ctf-title">' + escapeHtml(ctfName) + '</h3>\\n';
            code += '                        <div class="ctf-meta">\\n';
            code += '                            <span class="meta-item"><i class="far fa-calendar"></i> ' + ctfMonth + ' ' + ctfYear + '</span>\\n';
            code += '                            <span class="meta-item"><i class="fas fa-users"></i> Solo</span>\\n';
            code += '                        </div>\\n';
            code += '                        <p class="ctf-description">CTF writeup with ' + solvedCount + ' challenges solved.</p>\\n';
            code += '                        <div class="ctf-tags">\\n';
            code += '                            <span class="tag">CTF</span>\\n';
            code += '                        </div>\\n';
            code += '                        <div class="ctf-footer">\\n';
            code += '                            <span class="read-more">Read Writeup <i class="fas fa-arrow-right"></i></span>\\n';
            code += '                        </div>\\n';
            code += '                    </a>\\n';

            document.getElementById('outputText').textContent = code;
            document.getElementById('outputBox').style.display = 'block';
            document.getElementById('outputBox').scrollIntoView({ behavior: 'smooth' });
        }

        function copyOutput() {
            const text = document.getElementById('outputText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        function downloadHTML() {
            if (!generatedHTML) {
                alert('Generate writeup first!');
                return;
            }
            const ctfName = document.getElementById('ctfName').value.toLowerCase().replace(/\s+/g, '_');
            const blob = new Blob([generatedHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = ctfName + '_writeup.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            if (confirm('Clear everything?')) {
                document.getElementById('ctfName').value = '';
                document.getElementById('ctfOverview').value = '';
                document.getElementById('ctfTotal').value = '';
                document.getElementById('ctfRank').value = '';
                document.getElementById('ctfTeam').value = '';
                document.getElementById('challengesContainer').innerHTML = '';
                challengeCount = 0;
                generatedHTML = '';
            }
        }

        addChallenge();
    </script>
</body>
</html>
